<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Eevon — Interior Design Portfolio 2026">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#111;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
    a{color:inherit}
    .hero{min-height:58vh;padding:8vw 7vw;display:flex;align-items:flex-end;
      background:linear-gradient(180deg,#777 0%,#333 55%,#111 100%)}
    .eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#ccc;margin-bottom:18px}
    h1{font-size:clamp(58px,12vw,150px);line-height:.82;letter-spacing:-.06em;margin:0}
    .intro{max-width:650px;color:#ccc;font-size:18px;line-height:1.6;margin-top:28px}
    nav{position:sticky;top:0;z-index:5;background:rgba(17,17,17,.94);

      justify-content:space-between;align-items:center;gap:15px}
    .brand{font-weight:700;letter-spacing:.1em;font-size:13px}
    .buttons{display:flex;gap:10px;flex-wrap:wrap}
    .button{display:inline-block;text-decoration:none;border:1px solid #666;border-radius:30px;
      padding:10px 17px;font-size:13px}
    .button:hover{background:#fff;color:#111}
    main{padding:7vw}
    h2{font-size:clamp(34px,6vw,72px);letter-spacing:-.05em;margin:0 0 35px}
    .viewer{width:100%;height:78vh;min-height:560px;background:#222;border:1px solid #333}
    iframe{width:100%;height:100%;border:0}
    .fallback{padding:25px;color:#aaa}
    footer{border-top:1px solid #333;padding:45px 7vw 65px;color:#888;font-size:13px}
    @media(max-width:700px){
      .hero{min-height:55vh;padding:12vw 6vw}
      nav{padding:14px 6vw}
      main{padding:12vw 6vw}
      .viewer{height:70vh;min-height:450px}
      .brand{font-size:11px}
    }
  </style>
</head>
<body>

<section class="hero">
  <div>
    <div class="eyebrow">Interior Design Portfolio · 2026</div>

</section>

<nav>
