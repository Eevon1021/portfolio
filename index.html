<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PORTFOLIO 2026 | Eevon</title>
  <meta name="description" content="Eevon — Interior Design Portfolio 2026">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#e9e1d4;
      --surface:#f3ede3;
      --text:#3b372f;
      --muted:#756e63;
      --accent:#6f735c;
      --line:rgba(59,55,47,.15);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"DM Sans",Arial,sans-serif;
      font-weight:400;
      line-height:1.6;
    }

    a{color:inherit}

    .hero{
      min-height:54vh;
      padding:9vw 8vw 7vw;
      display:flex;
      align-items:flex-end;
      background:
        linear-gradient(rgba(233,225,212,.82),rgba(233,225,212,.95)),
        radial-gradient(circle at 82% 20%,#b9ad98 0,transparent 28%),
        radial-gradient(circle at 14% 76%,#c8bea9 0,transparent 30%);
      border-bottom:1px solid var(--line);
    }

    .hero-content{max-width:920px}

    .eyebrow{
      margin-bottom:20px;
      font-size:11px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--accent);
    }

    h1{
      margin:0;
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(68px,11vw,150px);
      line-height:.9;
      letter-spacing:-.045em;
      font-weight:500;
    }

    .intro{
      max-width:610px;
      margin:28px 0 0;
      color:var(--muted);
      font-size:clamp(15px,1.8vw,19px);
      font-weight:300;
    }

    nav{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      padding:16px 8vw;
      background:rgba(233,225,212,.94);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }

    .brand{
      font-size:12px;
      letter-spacing:.16em;
      font-weight:600;
      color:var(--accent);
    }

    .buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .button{
      display:inline-block;
      padding:10px 17px;
      border:1px solid rgba(59,55,47,.24);
      border-radius:2px;
      text-decoration:none;
      font-size:12px;
      letter-spacing:.04em;
      transition:.2s ease;
    }

    .button.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:#fff;
    }

    .button:hover{
      background:var(--text);
      border-color:var(--text);
      color:#fff;
    }

    main{
      max-width:1500px;
      margin:auto;
      padding:8vw 8vw 10vw;
    }

    h2{
      margin:0 0 30px;
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(44px,6vw,76px);
      line-height:1;
      font-weight:500;
      letter-spacing:-.035em;
    }

    .viewer{
      width:100%;
      height:min(82vh,1100px);
      min-height:560px;
      background:#d9d1c4;
      border:1px solid var(--line);
      box-shadow:0 18px 45px rgba(59,55,47,.08);
      overflow:hidden;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
    }

    footer{
      border-top:1px solid var(--line);
      padding:34px 8vw 50px;
      display:flex;
      justify-content:space-between;
      gap:20px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.03em;
    }

    @media(max-width:700px){
      .hero{min-height:50vh;padding:13vw 6vw 10vw}
      nav{padding:14px 6vw;align-items:flex-start;flex-direction:column}
      .buttons{justify-content:flex-start}
      main{padding:12vw 6vw 14vw}
      .viewer{height:72vh;min-height:450px}
      footer{padding-left:6vw;padding-right:6vw;display:block}
      footer div+div{margin-top:7px}
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-content">
    <div class="eyebrow">Interior Design Portfolio · 2026</div>
    <h1>PORTFOLIO</h1>
    <p class="intro">Presentations by Eevon.</p>
  </div>
</section>

<nav>
  <div class="brand">EEVON / 2026</div>
  <div class="buttons">
    <a class="button primary" href="PORTFOLIO%20-%202026.pdf" target="_blank" rel="noopener">View PDF</a>
    <a class="button" href="PORTFOLIO%20-%202026.pdf" download>Download PDF</a>
  </div>
</nav>

<main>
  <h2>Portfolio</h2>
  <div class="viewer">
    <iframe src="PORTFOLIO%20-%202026.pdf#view=FitH" title="PORTFOLIO 2026 PDF">
      <div style="padding:24px">
        PDF preview is not supported in this browser.
        <a href="PORTFOLIO%20-%202026.pdf">Open the PDF</a>.
      </div>
    </iframe>
  </div>
</main>

<footer>
  <div>© 2026 Eevon</div>
  <div>Interior Design Portfolio</div>
</footer>

</body>
</html>
